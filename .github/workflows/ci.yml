name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: catalystneuro/zarr-matlab
          path: zarr-matlab-dep

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hdmf-zarr (PR 325 branch, pinned) + pynwb
        run: pip install "git+https://github.com/hdmf-dev/hdmf-zarr@zarr-v3-migration" pynwb

      - name: Generate NWB-Zarr fixture
        run: python tools/make_nwb_fixture.py scratch/fixture.nwb.zarr

      # zstd MEX needed: NWB-Zarr uses zarr-python's default zstd compressor
      - name: Install compression libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libblosc-dev
      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd c-blosc

      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Build zarr-matlab MEX codecs
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            cd(fullfile(getenv('GITHUB_WORKSPACE'), 'zarr-matlab-dep'));
            addpath(fullfile(pwd, 'tools')); build_mex

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            cd(getenv('GITHUB_WORKSPACE'));
            setenv('ZARR_MATLAB_PATH', fullfile(pwd, 'zarr-matlab-dep'));
            run tools/run_tests.m
