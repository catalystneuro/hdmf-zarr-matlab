name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned hdmf-zarr zarr-v3-migration commit (PR hdmf-dev/hdmf-zarr#325).
  # Bump deliberately; the fixture cache keys off it.
  HDMF_ZARR_SHA: d5de9267cf44c41986ba01a41f94d02956c40fcd

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: catalystneuro/zarr-matlab
          path: zarr-matlab-dep

      # ---- Fixtures: deterministic given (hdmf-zarr SHA, generators) ------
      - name: Cache hdmf-zarr fixtures
        id: fixcache
        uses: actions/cache@v4
        with:
          path: scratch
          key: fixture-${{ env.HDMF_ZARR_SHA }}-${{ hashFiles('tools/make_nwb_fixture.py', 'tools/make_compound_fixture.py') }}

      - uses: actions/setup-python@v5
        if: steps.fixcache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install hdmf-zarr (pinned) + pynwb and generate fixtures
        if: steps.fixcache.outputs.cache-hit != 'true'
        run: |
          pip install "git+https://github.com/hdmf-dev/hdmf-zarr@${HDMF_ZARR_SHA}" pynwb
          python tools/make_nwb_fixture.py scratch/fixture.nwb.zarr
          python tools/make_compound_fixture.py scratch/fixture.compound.zarr

      # ---- zarr-matlab MEX: deterministic given (dep SHA, os) -------------
      - name: Resolve zarr-matlab dep SHA
        id: depsha
        run: echo "sha=$(git -C zarr-matlab-dep rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache zarr-matlab MEX binaries
        id: mexcache
        uses: actions/cache@v4
        with:
          path: zarr-matlab-dep/+zarr/+internal/*.mex*
          key: mex-${{ runner.os }}-${{ runner.arch }}-${{ steps.depsha.outputs.sha }}

      - name: Install compression libraries
        if: steps.mexcache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libblosc-dev
      - name: Install compression libraries (macOS)
        if: steps.mexcache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install zstd c-blosc

      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Build zarr-matlab MEX codecs
        if: steps.mexcache.outputs.cache-hit != 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            cd(fullfile(getenv('GITHUB_WORKSPACE'), 'zarr-matlab-dep'));
            addpath(fullfile(pwd, 'tools')); build_mex

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            cd(getenv('GITHUB_WORKSPACE'));
            setenv('ZARR_MATLAB_PATH', fullfile(pwd, 'zarr-matlab-dep'));
            run tools/run_tests.m

      - name: Write conventions fixture (MATLAB)
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            cd(getenv('GITHUB_WORKSPACE'));
            addpath(pwd, fullfile(pwd, 'tools'), fullfile(pwd, 'zarr-matlab-dep'));
            make_write_fixture('write_fixture.zarr')

      - name: Validate MATLAB-written conventions with zarr-python
        run: |
          pip install "zarr>=3.3" >/dev/null 2>&1 || pip install "zarr>=3.3"
          python tools/validate_conventions.py write_fixture.zarr
